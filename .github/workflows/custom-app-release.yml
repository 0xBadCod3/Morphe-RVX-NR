name: Custom - 3. Individual App Release
permissions: write-all
on:
  schedule:
    - cron: "0 10 * * *"
  workflow_run:
    workflows: ["Custom - 1. Manual Patch", "Custom - 2. Check new patch"]
    types:
      - completed
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || github.event.workflow_run.conclusion != 'cancelled' }}
    steps:
      - name: Checkout custom branch
        uses: actions/checkout@v6.0.2
        with:
          ref: custom

      - name: Individual App Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash src/build/app-release.sh
